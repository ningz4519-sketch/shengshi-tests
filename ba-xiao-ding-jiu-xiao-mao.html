        text(phase === 'won' ? T('救猫成功！', 'SUCCESS') : T('差一点点', 'RUN OVER'), 180, 270, 30);
        text(result, 180, 320, 16);
        text(T('得分 ', 'SCORE ') + score, 180, 354, 22, '#ffe299');

        text(T('再来一局 ↻', 'PLAY AGAIN ↻'), 180, 423, 21);

}
let level, pins, drops, delivered, levelTime, transition, stones, totalGold;
function setup() { pins = [{ x: 35, y: 245, w: 110, k: 'water', out: false }, { x: 215, y: 245, w: 110, k: 'lava', out: false }, { x: 125, y: 390, w: 110, k: 'gold', out: false }]; if (level >= 2)

    pins.push({ x: 35, y: 310, w: 110, k: 'water', out: false }); if (level >= 4)
    pins.push({ x: 215, y: 310, w: 110, k: 'lava', out: false }); drops = []; for (const [k, x, count, y] of [['water', 90, 24, 160], ['lava', 270, 12 + level * 2, 160], ['gold', 180, 10, 320]])
    for (let i = 0; i < count; i++)

function init() { level = 0; totalGold = 0; setup(); }
function input(p, down) { if (!down || transition)
    return; let pin = pins.find(q => !q.out && Math.abs(p.y - q.y) < 24 && p.x > q.x - 12 && p.x < q.x + q.w + 20); if (pin) {
    pin.out = true;

function hud() { return T('关卡 ', 'LEVEL ') + (level + 1) + '/5   ' + T('小鱼干 ', 'GOLD ') + delivered + '/10   ' + Math.ceil(17 - levelTime) + 's'; }
function update(dt) {
    if (transition) {

        return;
    }
    for (let d of drops) {
        if (d.done || d.k === 'stone')

        let ny = d.y + d.vy * dt;

    text(T('喵~ 谢谢你！', 'THANK YOU!'), 180, 545, 15); text(T('先给熔岩降温，再送小鱼干', 'COOL THE LAVA, THEN RELEASE GOLD'), 180, 630, 11, '#fff8dc'); }
